<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Residences — Modify Reservation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vietnamese text rendering optimization CSS -->
  <link rel="stylesheet" href="{{ url_for('static', path='global.css') }}" />
  <!-- Vietnamese text Unicode normalization JavaScript -->
  <script src="{{ url_for('static', path='vietnamese-text-normalizer.js') }}" defer></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#313131',
            cream: '#F3EEE7',
            'mid-gray': '#82847F',
            'light-border': '#DBDBDB',
          },
          fontFamily: {
            display: ['Georgia', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * { border-radius: 0 !important; }
    .field-input:focus { outline: none; border-color: #313131; }
  </style>
</head>
<body class="bg-cream text-charcoal font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-white border-b border-light-border">
    <div class="max-w-xl mx-auto px-6 py-10">
      <p class="text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2">Residences</p>
      <h1 class="font-display text-3xl font-normal">Modify Reservation</h1>
      <p class="text-mid-gray mt-2 text-sm">Reference #{{ booking.id }} · {{ room.room_number }}</p>
    </div>
  </header>

  <main class="flex-1 max-w-xl mx-auto w-full px-6 py-12">
    <form id="edit-form" class="bg-white border border-light-border p-8 space-y-6">
      <div>
        <label class="block text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2" for="guest_name">Guest Name</label>
        <input class="field-input w-full border border-light-border px-4 py-3 text-sm" id="guest_name" name="guest_name" type="text" value="{{ booking.guest_name }}" required />
      </div>
      <div>
        <label class="block text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2" for="guest_email">Email</label>
        <input class="field-input w-full border border-light-border px-4 py-3 text-sm" id="guest_email" name="guest_email" type="email" value="{{ booking.guest_email }}" required />
      </div>
      <div>
        <label class="block text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2" for="guest_phone">Phone</label>
        <input class="field-input w-full border border-light-border px-4 py-3 text-sm" id="guest_phone" name="guest_phone" type="tel" value="{{ booking.guest_phone or '' }}" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2" for="check_in">Check-in</label>
          <input class="field-input w-full border border-light-border px-4 py-3 text-sm" id="check_in" name="check_in" type="date" value="{{ booking.check_in }}" required />
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-[0.15em] text-mid-gray mb-2" for="check_out">Check-out</label>
          <input class="field-input w-full border border-light-border px-4 py-3 text-sm" id="check_out" name="check_out" type="date" value="{{ booking.check_out }}" required />
        </div>
      </div>
      <p id="form-message" class="hidden text-sm border border-light-border p-3"></p>
      <div class="flex gap-4 pt-2">
        <button type="submit" class="flex-1 py-3 bg-charcoal text-cream text-xs uppercase tracking-widest hover:bg-black transition-colors">Request Changes</button>
        <a href="{{ links.track_url }}" class="flex-1 py-3 border border-light-border text-center text-xs uppercase tracking-widest hover:border-charcoal transition-colors leading-[2.5]">Back</a>
      </div>
    </form>
    <p class="text-xs text-mid-gray mt-6 text-center">
      Date changes are subject to availability. Our team will confirm modifications by email.
    </p>
  </main>

  <footer class="text-center text-xs text-mid-gray py-8">
    &copy; {{ current_year }} Residences. All rights reserved.
  </footer>

  <script>
    (function () {
      'use strict';
      
      const SECURE_TOKEN = '{{ secure_token }}';
      const API_BASE = '{{ api_base_url | default("") }}';
      
      document.getElementById('edit-form').addEventListener('submit', async function (e) {
        e.preventDefault(); // CRITICAL: Prevent form default behavior
        
        const form = e.target;
        const submitBtn = form.querySelector('button[type="submit"]');
        const msg = document.getElementById('form-message');
        
        // Disable button to prevent double submission
        submitBtn.disabled = true;
        msg.classList.add('hidden');
        
        try {
          const checkInValue = document.getElementById('check_in').value;
          const checkOutValue = document.getElementById('check_out').value;
          
          if (!checkInValue || !checkOutValue) {
            throw new Error('Please provide both check-in and check-out dates.');
          }
          
          const payload = {
            check_in: checkInValue,
            check_out: checkOutValue
          };
          
          // Send request to backend
          const response = await fetch(
            `${API_BASE}/bookings/public/${encodeURIComponent(SECURE_TOKEN)}/change-request`,
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify(payload)
            }
          );
          
          const data = await response.json();
          
          if (!response.ok || !data.success) {
            throw new Error(data.message || `Error: ${response.status}`);
          }
          
          // Show success message
          msg.textContent = data.message || 'Yêu cầu thay đổi ngày đã được gửi tới quản trị viên. Vui lòng kiểm tra email của bạn để nhận xác nhận.';
          msg.classList.remove('hidden');
          msg.classList.add('bg-green-100', 'text-green-800', 'border-green-300');
          msg.classList.remove('bg-cream');
          
          // Optional: Reset form after 2 seconds
          setTimeout(() => {
            form.reset();
            msg.classList.add('hidden');
          }, 5000);
          
        } catch (error) {
          console.error('Error:', error);
          msg.textContent = error instanceof Error ? error.message : 'An error occurred while processing your request.';
          msg.classList.remove('hidden');
          msg.classList.add('bg-red-100', 'text-red-800', 'border-red-300');
          msg.classList.remove('bg-cream');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
